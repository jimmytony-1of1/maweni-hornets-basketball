<style>

:root {
    --black: #0a0a0a;
    --dark: #131111;
    --dark2: #1c1818;
    --yellow: #ec3a2c;
    --gold: #c62018;
    --white: #ffffff;
    --light: #f4f1ee;
    --gray: #aeb7ba;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: "Barlow Condensed", sans-serif; background: var(--black); color: var(--white); }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }

/* NAVIGATION */
header {
    position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
    padding: 18px 5%; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo img { width: 64px; height: 64px; object-fit: contain; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--yellow); }
.logo-text { font-size: 28px; font-weight: 900; line-height: .8; text-transform: uppercase; }
.logo-text span { color: var(--yellow); }
nav { display: flex; gap: 30px; }
nav a { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: .3s; }
nav a:hover, nav a.active { color: var(--yellow); }
.contact-btn { background: var(--yellow); color: #000; padding: 13px 23px; font-weight: 800; text-transform: uppercase; }

/* HERO */
.hero {
    min-height: 720px; position: relative; display: flex; align-items: center; overflow: hidden;
    background: linear-gradient(90deg, rgba(10,0,0,.92) 0%, rgba(0,0,0,.58) 42%, rgba(0,0,0,.15) 100%),
                var(--hero-bg, none);
    background-size: cover; background-position: center;
}
.hero-content { width: 55%; padding-left: 7%; padding-top: 80px; position: relative; z-index: 3; }
.location { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; margin-bottom: 20px; }
.location span { color: var(--yellow); }
.hero h1 { font-family: "Bebas Neue", sans-serif; font-size: clamp(80px, 10vw, 160px); line-height: .78; text-transform: uppercase; letter-spacing: 2px; }
.hero h1 span { color: var(--yellow); }
.hero-subtitle { margin-top: 25px; font-size: 25px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
.hero-buttons { margin-top: 35px; display: flex; gap: 15px; }
.btn { display: inline-block; padding: 16px 28px; background: var(--yellow); color: #000; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
.btn-outline { background: transparent; border: 1px solid var(--yellow); color: white; }
.hero-logo { position: absolute; right: 8%; top: 50%; transform: translateY(-45%); width: min(38vw, 460px); border-radius: 50%; box-shadow: 0 0 0 6px var(--yellow), 0 0 80px rgba(236,58,44,.55); z-index: 2; }
.hero-player { position: absolute; right: 4%; bottom: 0; width: 48%; max-height: 95%; object-fit: contain; object-position: bottom; }

/* NEXT GAME */
.next-game { background: #0d0b0b; border-top: 2px solid var(--yellow); border-bottom: 2px solid var(--yellow); padding: 30px 6%; }
.game-wrapper { max-width: 1300px; margin: auto; display: grid; grid-template-columns: 1fr 1.4fr 1fr; align-items: center; gap: 30px; }
.game-label { color: var(--yellow); text-transform: uppercase; font-weight: 800; letter-spacing: 3px; }
.game-date { font-size: 25px; font-weight: 800; margin-top: 7px; }
.game-location { color: var(--gray); margin-top: 5px; }
.matchup { display: flex; justify-content: center; align-items: center; gap: 35px; }
.team { text-align: center; }
.team img { width: 75px; height: 75px; object-fit: contain; margin: auto; border-radius: 50%; }
.team h3 { margin-top: 8px; font-size: 20px; }
.vs { font-size: 30px; font-weight: 900; color: var(--yellow); }
.countdown { display: flex; justify-content: center; gap: 18px; }
.time strong { display: block; font-size: 38px; color: var(--yellow); }
.time small { text-transform: uppercase; color: var(--gray); }

/* STORY */
.story { display: grid; grid-template-columns: 1fr 1fr; min-height: 520px; }
.story-image { background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.3)), var(--story-bg, none); background-size: cover; background-position: center; }
.story-content { padding: 80px; display: flex; flex-direction: column; justify-content: center; background: var(--dark); }
.section-label { color: var(--yellow); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }
.story h2 { font-family: "Bebas Neue", sans-serif; font-size: 80px; line-height: .9; margin: 15px 0 25px; }
.story h2 span { color: var(--yellow); }
.story p { color: #cfc9c7; font-size: 18px; line-height: 1.6; max-width: 550px; }
.values { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-top: 35px; }
.value { border-top: 2px solid var(--yellow); padding-top: 12px; }
.value strong { display: block; color: var(--yellow); text-transform: uppercase; }
.value small { color: var(--gray); }

/* TEAM */
.team-section { background: var(--light); color: #111; padding: 80px 6%; }
.section-heading { max-width: 1300px; margin: auto auto 40px; }
.section-heading h2 { font-family: "Permanent Marker", cursive; font-size: 65px; text-transform: uppercase; }
.section-heading p { color: #555; }
.players { max-width: 1300px; margin: auto; display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; }
.player-card { background: white; overflow: hidden; transition: .3s; }
.player-card:hover { transform: translateY(-8px); }
.player-image { height: 330px; background: #151515; overflow: hidden; }
.player-image img { width: 100%; height: 100%; object-fit: cover; }
.player-info { padding: 17px; }
.player-number { color: var(--gold); font-weight: 900; }
.player-info h3 { font-size: 28px; text-transform: uppercase; }
.player-position { color: #777; }

/* SCHEDULE */
.schedule { padding: 80px 6%; background: var(--dark); }
.schedule-container { max-width: 1300px; margin: auto; }
.schedule h2 { font-family: "Permanent Marker", cursive; font-size: 60px; }
.games { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 40px; }
.game-card { border: 1px solid #3a2e2c; padding: 25px; background: #181414; }
.game-card .date { color: var(--yellow); font-weight: 800; }
.game-teams { display: flex; justify-content: space-around; align-items: center; text-align: center; margin: 25px 0; }
.game-teams img { width: 60px; height: 60px; object-fit: contain; border-radius: 50%; }
.game-teams h4 { margin-top: 8px; }

/* NEWS */
.news { background: var(--light); color: #111; padding: 80px 6%; }
.news-container { max-width: 1300px; margin: auto; }
.news-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 25px; margin-top: 40px; }
.news-card { background: white; }
.news-card img { width: 100%; height: 220px; object-fit: cover; }
.news-info { padding: 20px; }
.news-info small { color: var(--gold); font-weight: 800; }
.news-info h3 { font-size: 25px; margin: 10px 0; }
.read-more { color: #111; font-weight: 800; text-transform: uppercase; }

/* GALLERY */
.gallery { padding: 80px 6%; background: var(--black); }
.gallery-container { max-width: 1300px; margin: auto; }
.gallery-grid { margin-top: 40px; display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.gallery-grid img { width: 100%; height: 230px; object-fit: cover; transition: .3s; }
.gallery-grid img:hover { transform: scale(1.03); }

/* FOOTER */
footer { background: #070606; padding: 60px 6% 25px; border-top: 2px solid var(--yellow); }
.footer-container { max-width: 1300px; margin: auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; }
.footer-brand h2 { font-family: "Bebas Neue"; font-size: 45px; }
.footer-brand span { color: var(--yellow); }
footer h3 { margin-bottom: 15px; color: var(--yellow); text-transform: uppercase; }
footer a { display: block; color: #aaa; margin-bottom: 8px; }
.copyright { max-width: 1300px; margin: 50px auto 0; padding-top: 20px; border-top: 1px solid #2e2726; color: #777; }


[hidden]{display:none!important}
.logo{user-select:none;-webkit-user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero{background-color:#150404}
.badge{width:75px;height:75px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#1c1818;border:2px solid var(--yellow);font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:1px}
.game-teams .badge{width:60px;height:60px;font-size:22px}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:"Bebas Neue",sans-serif;font-size:110px;color:#4a2a27;background:linear-gradient(160deg,#2a0f0d,#0a0a0a)}
.news-ph{height:220px;display:grid;place-items:center;font-size:60px;background:linear-gradient(160deg,#2a0f0d,#0a0a0a)}
.gph{height:230px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,#2a0f0d,#151010)}
.game-card.past{opacity:.5}
.game-card .tag{display:inline-block;margin-left:8px;font-size:12px;background:#3a2e2c;padding:2px 8px;letter-spacing:1px}
.empty-note{color:var(--gray);padding:10px 0}
.news-info p{color:#555}

/* ADMIN */
#loginOv{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
#loginForm{background:#141010;border:2px solid var(--yellow);padding:30px;width:min(360px,100%);text-align:center;font-family:"Barlow Condensed",sans-serif}
#loginForm img{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;background:#fff}
#loginForm h3{font-size:26px;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}
#loginForm input{width:100%;padding:13px;font-size:18px;background:#0a0a0a;border:1px solid #4a3a38;color:#fff;text-align:center;font-family:inherit}
#loginErr{color:#ff7b6e;min-height:22px;margin:8px 0}
#loginForm .row{display:flex;gap:10px}
#loginForm button,.abtn{flex:1;padding:12px;font:800 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--yellow);background:transparent;color:#fff;cursor:pointer}
#loginForm button[type=submit],.abtn.pri{background:var(--yellow);color:#000}
#fab{position:fixed;left:16px;bottom:16px;z-index:1500;background:var(--yellow);color:#000;border:0;padding:12px 18px;font:900 15px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#panel{position:fixed;top:0;right:0;height:100vh;width:min(470px,100vw);background:#120e0e;color:#eee;z-index:1800;border-left:2px solid var(--yellow);display:flex;flex-direction:column;transition:transform .3s;font-family:"Barlow Condensed",sans-serif;font-size:16px}
#panel.closed{transform:translateX(105%)}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#1c1414;border-bottom:1px solid #3a2e2c}
.p-head img{width:38px;height:38px;border-radius:50%;background:#fff}
.p-head b{font-size:20px;text-transform:uppercase;letter-spacing:1px;flex:1}
#pstatus{font-size:13px;color:#7fdc8f}#pstatus.err{color:#ff7b6e}
.p-head button{background:none;border:1px solid #4a3a38;color:#fff;font-size:18px;width:34px;height:34px;cursor:pointer}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#181212;border-bottom:1px solid #3a2e2c}
#tabs button{padding:8px 12px;background:#221919;border:0;color:#cbbcb9;font:700 14px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
#tabs button.on{background:var(--yellow);color:#000}
#pbody{flex:1;overflow-y:auto;padding:14px 14px 60px}
#pbody h4{color:var(--yellow);text-transform:uppercase;letter-spacing:2px;margin:18px 0 8px;font-size:15px;border-bottom:1px solid #3a2e2c;padding-bottom:4px}
#pbody h4:first-child{margin-top:0}
#pbody label.f{display:block;margin-bottom:10px;font-size:13px;color:#b9a9a6;text-transform:uppercase;letter-spacing:1px}
#pbody label.f input,#pbody label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;background:#0a0a0a;border:1px solid #3d302e;color:#fff;font:16px "Barlow Condensed",sans-serif;text-transform:none;letter-spacing:0}
#pbody label.f input:focus,#pbody label.f textarea:focus{outline:1px solid var(--yellow)}
.card{background:#1a1414;border:1px solid #33292a;padding:10px;margin-bottom:10px}
.card .ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--yellow);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.mini{background:#2a2020;border:1px solid #45393a;color:#fff;padding:4px 9px;margin-left:4px;cursor:pointer;font:700 13px "Barlow Condensed",sans-serif}
.mini.del{border-color:#8a2a22;color:#ff8d80}
.imgf>span{display:block;font-size:13px;color:#b9a9a6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.imgrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.imgrow img,.imgrow i{width:70px;height:70px;object-fit:cover;background:#0a0a0a;border:1px solid #3d302e;display:grid;place-items:center;color:#777;font-size:12px}
.imgrow>div{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:var(--yellow);color:#000;padding:7px 12px;font:800 14px "Barlow Condensed",sans-serif;text-transform:uppercase;cursor:pointer}
.gthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gthumbs div{position:relative}.gthumbs img{width:100%;height:80px;object-fit:cover}
.gthumbs button{position:absolute;top:2px;right:2px;background:#000c;border:0;color:#fff;cursor:pointer;width:24px;height:24px}
.pnote{color:#9d8d8a;font-size:14px;line-height:1.4;margin:6px 0 12px}
.arow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
@media(max-width:550px){#panel{width:100vw}}

/* SHOP */
.shop{padding:80px 6%;background:var(--black);border-top:1px solid #2e2726}
.shop-container{max-width:1300px;margin:auto}
.shop .section-heading{margin-left:0}
.shop .section-heading h2{font-family:"Permanent Marker",cursive;font-size:60px;text-transform:uppercase}
.shop .section-heading p{color:var(--gray)}
.shop-steps{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.shop-steps div{flex:1;min-width:200px;border-top:2px solid var(--yellow);padding-top:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:#d8d0ce}
.shop-steps b{color:var(--yellow);font-size:22px;margin-right:6px}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.prod{background:#181414;border:1px solid #3a2e2c;display:flex;flex-direction:column;transition:.3s}
.prod:hover{transform:translateY(-6px);border-color:var(--yellow)}
.prod-img{position:relative;height:260px;background:#0d0b0b;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-img .ph{font-size:70px}
.soldout{position:absolute;top:10px;left:10px;background:#000;color:#fff;padding:4px 10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:13px}
.prod.out .prod-img img{opacity:.45}
.prod-info{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.prod-info h3{font-size:24px;text-transform:uppercase}
.prod-info p{color:var(--gray);font-size:16px}
.prod-price{color:var(--yellow);font-size:26px;font-weight:900}
.prod-row{display:flex;gap:8px}
.prod-row select,.prod-row input{flex:1;min-width:0;padding:9px;background:#0a0a0a;border:1px solid #4a3a38;color:#fff;font:700 16px "Barlow Condensed",sans-serif}
.prod-row input{max-width:80px}
.prod .btn{margin-top:auto;border:0;cursor:pointer;text-align:center;font-size:16px}
.prod .btn:disabled{background:#3a2e2c;color:#999;cursor:not-allowed}
.shop-pay{margin-top:18px;padding:14px 16px;border-left:3px solid var(--yellow);background:#181414;color:#d8d0ce;line-height:1.4}
.shop-pay b{color:var(--yellow);text-transform:uppercase;letter-spacing:1px}
#cartBtn{position:fixed;right:16px;bottom:16px;z-index:1400;background:var(--yellow);color:#000;border:0;padding:13px 20px;font:900 16px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#cartCount{display:inline-block;min-width:22px;margin-left:6px;background:#000;color:#fff;border-radius:11px;padding:0 6px;text-align:center}
#cart{position:fixed;top:0;right:0;height:100vh;width:min(430px,100vw);background:#120e0e;color:#eee;z-index:1700;border-left:2px solid var(--yellow);display:flex;flex-direction:column;transition:transform .3s;font-family:"Barlow Condensed",sans-serif;font-size:17px}
#cart.closed{transform:translateX(105%)}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#1c1414;border-bottom:1px solid #3a2e2c}
.cart-head b{font-size:22px;text-transform:uppercase;letter-spacing:1px}
.cart-head button{background:none;border:1px solid #4a3a38;color:#fff;width:34px;height:34px;font-size:18px;cursor:pointer}
#cartBody{flex:1;overflow-y:auto;padding:14px 16px 30px}
#cartBody .btn{width:100%;border:0;cursor:pointer;text-align:center;margin-top:12px;font-size:17px}
#cartBody .btn.wa{background:#25d366}
.cl{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #2e2726}
.cl-img{width:64px;height:64px;background:#0a0a0a;display:grid;place-items:center;font-size:26px;flex-shrink:0;overflow:hidden}
.cl-img img{width:100%;height:100%;object-fit:cover}
.cl-info{flex:1;display:flex;flex-direction:column;gap:2px}.cl-info small{color:var(--gray)}.cl-info span{color:var(--yellow);font-weight:800}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:28px;height:28px;background:#2a2020;border:1px solid #45393a;color:#fff;cursor:pointer;font-size:16px}
.qty em{font-style:normal;min-width:20px;text-align:center;font-weight:800}
.qty .rm{width:auto;padding:0 8px;font-size:13px;margin-left:6px;color:#ff8d80;border-color:#8a2a22}
.cl-tot{font-weight:800;white-space:nowrap}
.cart-total{display:flex;justify-content:space-between;font-size:22px;padding:14px 0}.cart-total b{color:var(--yellow)}
.cart-empty,.cart-done{text-align:center;padding:40px 10px;color:#d8d0ce}.cart-done .big{font-size:54px}.cart-done h3{font-size:28px;margin:8px 0}
.cf h4{color:var(--yellow);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.cf input,.cf select,.cf textarea{display:block;width:100%;margin-bottom:8px;padding:11px;background:#0a0a0a;border:1px solid #4a3a38;color:#fff;font:17px "Barlow Condensed",sans-serif}
.cf-err{color:#ff7b6e;min-height:20px;margin-top:6px}
.cf .link{background:none;border:0;color:var(--gray);cursor:pointer;margin-top:10px;font:16px "Barlow Condensed",sans-serif}
#cartBody .btn.sms{background:#fff;color:#000}
#cartBody .link{display:block;margin:12px auto 0;background:none;border:0;color:var(--gray);cursor:pointer;font:16px "Barlow Condensed",sans-serif;width:auto}
.cart-hint{color:var(--gray);font-size:14px;margin-top:10px}

.gal-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 4px}
.gtab{padding:10px 22px;background:transparent;border:1px solid #4a3a38;color:#d8d0ce;font:800 16px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s}
.gtab:hover{border-color:var(--yellow)}
.gtab.on{background:var(--yellow);border-color:var(--yellow);color:#000}
.gi{position:relative;overflow:hidden}
.gi span{position:absolute;left:8px;bottom:8px;background:#000c;padding:2px 9px;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff}


#pbody label.f select{display:block;width:100%;margin-top:4px;padding:9px 10px;background:#0a0a0a;border:1px solid #3d302e;color:#fff;font:16px "Barlow Condensed",sans-serif;text-transform:none;letter-spacing:0}
#em{margin-bottom:10px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2500;background:#25d366;color:#000;padding:12px 20px;font:800 17px "Barlow Condensed",sans-serif;letter-spacing:.5px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:92vw;text-align:center}

#pmode{padding:8px 14px;font-size:14px;line-height:1.3;background:#181212;border-bottom:1px solid #3a2e2c;color:#9d8d8a}
#pmode.ok{color:#7fdc8f}#pmode.bad{color:#ff7b6e}

.sync{margin-top:10px;font-size:12px;color:#6b5f5d}


/* ===================== RESPONSIVE ===================== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:clip}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* fluid type */
.story h2{font-size:clamp(50px,6.2vw,80px)}
.section-heading h2,.schedule h2,.shop .section-heading h2{font-size:clamp(40px,5.2vw,64px)}
.gallery h2{font-family:"Permanent Marker",cursive;font-size:clamp(40px,5.2vw,60px);text-transform:uppercase}
.footer-brand h2{font-size:clamp(34px,8vw,45px)}

/* wide screens: keep content aligned with the 1300px sections */
header{padding:18px max(5%,calc((100vw - 1400px)/2))}
.hero-content{padding-left:max(7%,calc((100vw - 1300px)/2))}
.hero-logo{width:min(34vw,440px);right:max(8%,calc((100vw - 1300px)/2))}

/* grids */
.players{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.shop-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.news-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.games{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.gallery-grid{grid-template-columns:repeat(4,1fr)}
.player-image{height:clamp(220px,30vw,330px)}
.prod-img{height:clamp(170px,22vw,260px)}
.news-card img,.news-ph{height:clamp(180px,26vw,220px)}
.gallery-grid img,.gph{height:clamp(140px,28vw,230px)}

/* mobile menu button (hidden on desktop) */
.menu-btn{display:none;position:relative;z-index:2;width:46px;height:46px;place-items:center;background:transparent;border:1px solid var(--yellow);color:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
.nav-cta{display:none}
.gtab{min-height:44px}

@media(max-width:1300px){nav{gap:20px}}

/* laptops small / tablets: collapse the menu */
@media(max-width:1100px){
  html{scroll-padding-top:74px}
  header{position:fixed;background:rgba(10,10,10,.9);padding:10px 5%;gap:12px}
  .logo{margin-right:auto;position:relative;z-index:2}
  .contact-btn{position:relative;z-index:2}
  .menu-btn{display:grid}
  nav{position:fixed;top:0;left:0;right:0;z-index:1;flex-direction:column;gap:0;padding:86px 5% 24px;background:rgba(10,10,10,.98);border-bottom:2px solid var(--yellow);transform:translateY(-110%);transition:transform .3s;max-height:100vh;max-height:100dvh;overflow-y:auto;visibility:hidden}
  header.open nav{transform:none;visibility:visible}
  nav a{padding:16px 4px;font-size:20px;border-bottom:1px solid #2e2726}
  .nav-cta{display:block;margin-top:16px;background:var(--yellow);color:#000;text-align:center;padding:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px;border-bottom:0}
  header.scrolled{background:rgba(10,10,10,.96);box-shadow:0 2px 0 var(--yellow)}
  header.open{background:rgba(10,10,10,.98)}
  .values{grid-template-columns:repeat(2,1fr)}
  .story-content{padding:56px 44px}
  .gallery-grid{grid-template-columns:repeat(3,1fr)}
}

/* tablets portrait & below: stack */
@media(max-width:900px){
  .hero{min-height:680px}
  .hero-content{width:100%;padding:120px 7% 56px}
  .hero h1{font-size:clamp(60px,16vw,120px)}
  .hero-subtitle{font-size:clamp(16px,4.6vw,25px);letter-spacing:2px}
  .location{letter-spacing:3px}
  .hero-logo{opacity:.2;width:min(70vw,420px);right:-8%;top:50%;transform:translateY(-40%)}
  .next-game{padding:26px 5%}
  .game-wrapper{grid-template-columns:1fr;text-align:center;gap:22px}
  .story{grid-template-columns:1fr}
  .story-image{min-height:300px;height:320px}
  .story-content{padding:52px 6%}
  .footer-container{grid-template-columns:repeat(2,1fr);gap:32px}
  .footer-brand{grid-column:1/-1}
}

/* phones */
@media(max-width:700px){
  .team-section,.schedule,.news,.gallery,.shop{padding:56px 5%}
  footer{padding:48px 5% 22px}
  .players{grid-template-columns:repeat(2,1fr);gap:12px}
  .player-info{padding:12px}
  .player-info h3{font-size:22px}
  .shop-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .prod-info{padding:12px}
  .prod-info h3{font-size:20px}
  .prod-price{font-size:22px}
  .prod-row{flex-direction:column}
  .prod-row input{max-width:none}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .gtab{padding:10px 16px}
  .section-heading{margin-bottom:28px}
}
@media(max-width:640px){
  .contact-btn{display:none}
  .logo img{width:48px;height:48px}
}
@media(max-width:480px){
  .logo-text{font-size:21px}
  .matchup{gap:14px}
  .team img,.badge{width:60px;height:60px}
  .team h3{font-size:16px}
  .countdown{gap:12px}
  .time strong{font-size:30px}
  .game-date{font-size:22px}
  .values{grid-template-columns:repeat(2,1fr);gap:14px}
  .btn{padding:14px 22px}
  .hero-buttons{flex-wrap:wrap}
  .game-card{padding:18px}
}
@media(max-width:340px){
  .players,.shop-grid,.gallery-grid{grid-template-columns:1fr}
  .footer-container{grid-template-columns:1fr}
}

/* admin panel & drawers on small screens */
#panel,#cart{height:100vh;height:100dvh}
@media(max-width:600px){#panel,#cart{width:100vw}}
#fab{bottom:max(16px,env(safe-area-inset-bottom))}
#pbody{padding-bottom:90px}
@media(pointer:coarse){
  .mini{padding:9px 13px}
  .qty button{width:38px;height:38px}
  #tabs button{padding:11px 14px}
  .gthumbs button{width:32px;height:32px}
}

</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = str => { str = 'mhc|' + str; let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); };
const get = p => p.split('.').reduce((o,k)=>o==null?o:o[k], data);
const set = (p,v) => { const ks=p.split('.'), l=ks.pop(); ks.reduce((o,k)=>o[k],data)[l]=v; };
const clone = o => JSON.parse(JSON.stringify(o));
const logoSrc = () => data.images.logo || LOGO;
const initials = n => String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const badge = (src,name) => src ? `<img src="${esc(src)}" alt="${esc(name)}">` : `<div class="badge">${esc(initials(name))}</div>`;
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'], MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const fmtDate = w => { const d=new Date(w); if(isNaN(d)) return ''; return `${DAYS[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtTime = w => { const d=new Date(w); if(isNaN(d)) return ''; let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'), ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${m} ${ap}`; };
const sortedGames = () => [...data.schedule.games].sort((a,b)=>new Date(a.when)-new Date(b.when));
const nextGame = () => sortedGames().find(g => new Date(g.when) > new Date());

/* ---------- storage ---------- */
function load(){
  let st=null;
  if(SB_OK){ try{ st=JSON.parse(localStorage.getItem(KEY+'_remote')); }catch(e){} data = (st && st.club) ? st : clone(SEED); migrate(); return; }
  try{ st=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  data = (st && st.v > (SEED.v||0)) ? st : clone(SEED);
  migrate();
}
function migrate(){
  if(data.shop && Array.isArray(data.shop.items)){
    const SPLIT={'Hornets Hoodie':[['Black Hoodie','Black Maweni Hornets hoodie. Warm, soft and built for game night.'],['White Hoodie','White Maweni Hornets hoodie. Warm, soft and built for game night.']],
                 'Hornets Cap':[['Black Cap','Black Maweni Hornets cap. One size, adjustable.'],['White Cap','White Maweni Hornets cap. One size, adjustable.']]};
    const out=[];
    data.shop.items.forEach(it=>{ const sp=SPLIT[it.name];
      if(sp && /^(Warm, soft and built for game night\.|One size, adjustable\.)$/.test(it.desc||'')) sp.forEach(([n,d])=>out.push(Object.assign({},it,{name:n,desc:d})));
      else out.push(it); });
    data.shop.items=out;
  }
  if(data.shop && data.shop.smsNumber===undefined){ data.shop.smsNumber=SEED.shop.smsNumber; if(!data.shop.whatsapp) data.shop.whatsapp=SEED.shop.whatsapp; if(/add yours in the admin/.test(data.shop.payInfo||'')) data.shop.payInfo=SEED.shop.payInfo; }
  if(data.shop && data.shop.items){ const T={'Home Jersey':['Black T-Shirt','Classic black Maweni Hornets tee.'],'Away Jersey':['White T-Shirt','Classic white Maweni Hornets tee.']};
    data.shop.items.forEach(it=>{ if(T[it.name] && /^Official Maweni Hornets (home|away) jersey\.$/.test(it.desc||'')){ it.desc=T[it.name][1]; it.name=T[it.name][0]; if(it.price==='2500') it.price='1500'; } }); }
  if(data.gallery && !data.gallery.cats){ data.gallery.cats=clone(SEED.gallery.cats); }
  if(data.gallery){ data.gallery.images=data.gallery.images.map(x=>typeof x==='string'?{src:x,cat:'games'}:x); }
  if(!data.shop){ data.shop = clone(SEED.shop); if(!data.nav.some(n=>n.href==='#shop')) data.nav.splice(Math.min(3,data.nav.length),0,{label:'Shop',href:'#shop'}); }
}
function status(msg, err){ const s=$('#pstatus'); if(!s) return; s.textContent=msg; s.className=err?'err':''; }
const DEBUG = /[?&]debug\b/.test(location.search);
function dbg(msg){
  if(!DEBUG) return; let b=$('#dbg');
  if(!b){ b=document.createElement('div'); b.id='dbg'; b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:3000;background:#000;color:#0f0;font:13px/1.4 monospace;padding:10px;border:1px solid #0f0;white-space:pre-wrap;max-height:45vh;overflow:auto'; document.body.appendChild(b); }
  b.textContent += msg+'\n';
}
const restHeaders = extra => Object.assign({apikey:SB_KEY}, SB_KEY.startsWith('sb_') ? {} : {Authorization:'Bearer '+SB_KEY}, extra||{});
async function restRead(){
  const r = await fetch(`${SB_URL}/rest/v1/site_content?id=eq.1&select=data,updated_at`, {headers:restHeaders({Accept:'application/json'}), cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));
  const rows = await r.json(); return rows[0] || null;
}
async function pullRemote(){
  if(!SB_OK){ dbg('NOT CONNECTED: config.js is missing or its two values are empty.'); return; }
  dbg('Connected to: '+SB_URL.replace(/^https?:\/\//,''));
  try{
    const row=await restRead();
    sync.txt = row ? ('Live data: connected ✓ · last saved '+new Date(row.updated_at).toLocaleString('en-KE')) : 'Live data: connected, but no saved content was found';
    { const el=$('#syncNote'); if(el) el.textContent=sync.txt; }
    if(row){ const d=row.data||{}; dbg('Online content found. Saved: '+row.updated_at+'\nHero photo: '+((d.images&&d.images.heroBg)?'set':'empty')+' | Logo: '+((d.images&&d.images.logo)?'custom':'default')+' | Gallery photos: '+(((d.gallery||{}).images||[]).length)+' | Player photos: '+(((d.team||{}).players||[]).filter(p=>p.photo).length)); }
    else dbg('NO ROW RETURNED: the table is empty or visitors are blocked from reading it.');
    if(row && row.data && row.data.club){
      data=row.data; migrate(); renderSite();
      try{ localStorage.setItem(KEY+'_remote',JSON.stringify(data)); }catch(e){}
      if(!$('#panel').classList.contains('closed')) renderPanel();
    }
  }catch(e){ console.warn('Could not load online content', e); dbg('ERROR reading online content: '+(e.message||e)); sync.txt='Live data error: '+(e.message||e); const el=$('#syncNote'); if(el) el.textContent=sync.txt; }
}
let pushT;
function pushRemote(){
  if(!sb||!sbAuthed) return;
  status('Saving…'); clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    const pub=clone(data); delete pub.pass;
    const {error}=await sb.from('site_content').upsert({id:1,data:pub,updated_at:new Date().toISOString()});
    if(error) status('Online save failed: '+error.message,true);
    else { status('Saved online ✓'); try{ localStorage.setItem(KEY+'_remote',JSON.stringify(pub)); }catch(e){} }
  },700);
}
function save(){
  data.v = Date.now();
  if(sb){ pushRemote(); return; }
  try{ localStorage.setItem(KEY, JSON.stringify(data)); status('Saved ✓'); }
  catch(e){ status('Storage full — use smaller photos or Export', true); }
}
let rt; const later = () => { clearTimeout(rt); rt=setTimeout(renderSite,120); };

    const size=(card.querySelector('.psize')||{}).value||'', qty=Math.max(1,Math.min(20,parseInt(card.querySelector('.pqty').value)||1));
    cart=[{name:it.name,size,qty}]; openCart('checkout'); return; }
  const c=e.target.closest('#cart [data-c]'); if(!c) return;
  const act=c.dataset.c, i=+c.dataset.i;
  if(act==='close'){ closeCart(); return; }
  if(act==='inc') cart[i].qty=Math.min(20,cart[i].qty+1);
  else if(act==='dec') cart[i].qty=Math.max(1,cart[i].qty-1);
  else if(act==='rm') cart.splice(i,1);
  else if(act==='checkout') cartView='checkout';

  else if(act==='sendsms'){ sendOrder('sms'); return; }

  const s=data.shop;
  if(!name||!phone){ err.textContent='Please enter your name and phone number.'; return; }

  if(SB_OK) fetch(`${SB_URL}/rest/v1/orders`, {method:'POST', keepalive:true, headers:restHeaders({'Content-Type':'application/json',Prefer:'return=minimal'}),

  lastMsg=msg; cart=[]; saveCart(); cartView='done'; renderCart(); deliver(kind,msg);
}

function fileToData(file,max,png){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{ const im=new Image(); im.onerror=rej;
      im.onload=()=>{ let w=im.width,h=im.height; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d');
        if(!png){ x.fillStyle='#fff'; x.fillRect(0,0,w,h); }
        x.drawImage(im,0,0,w,h); res(png?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.82)); };
      im.src=r.result; };
    r.readAsDataURL(file);
  });
}
function cleanName(fn){ let s=String(fn).replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').trim(); if(!s||/\d{3,}/.test(s)||/^(img|dsc|image|photo|screenshot|whatsapp|pxl|picsart)/i.test(s)) return ''; return s.replace(/\b\w/g,c=>c.toUpperCase()); }
async function imgUpload(file,max,png){
  const url = await fileToData(file,max,png);
  if(!sb||!sbAuthed) return url;
  try{
    const blob = await (await fetch(url)).blob();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${png?'png':'jpg'}`;
    const {error} = await sb.storage.from('site-images').upload(path, blob, {contentType:blob.type, cacheControl:'31536000'});
    if(error) throw error;
    return sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
  }catch(e){ throw new Error('Photo upload failed: '+(e.message||e)); }
}

    <div class="arow"><button class="abtn pri" data-a="add" data-k="news">+ Add article</button><label class="abtn" style="text-align:center">+ Add articles from photos<input type="file" accept="image/*" multiple data-bulk="news" hidden></label></div>
    <p class="pnote">Tip: select several photos at once — each photo becomes its own new card (named from the file name; you can rename it after).</p>`; },
  gallery(){ return `
    <h4>Gallery section</h4>${F('Small label','gallery.label')}${F('Title','gallery.title')}
    <h4>Category names</h4>${data.gallery.cats.map((c,i)=>F('Category '+(i+1),`gallery.cats.${i}.name`)).join('')}
    ${data.gallery.cats.map(c=>{ const list=data.gallery.images.map((im,i)=>({...im,i})).filter(im=>im.cat===c.id);
      return `<h4>${esc(c.name)} (${list.length})</h4><label class="fbtn" style="display:inline-block">+ Upload photos<input type="file" accept="image/*" multiple data-gal="${c.id}" hidden></label>
      <div class="gthumbs">${list.map(im=>`<div><img src="${esc(im.src)}" alt=""><button data-a="del" data-k="gal" data-i="${im.i}">✕</button></div>`).join('')}</div>`; }).join('')}`; },
  footer(){ return `
    <h4>Footer</h4>${F('Line under name','footer.line')}${F('Motto','footer.motto')}${F('Copyright','footer.copy')}
    ${data.footer.cols.map((col,ci)=>`<h4>Column ${ci+1}</h4>${F('Column title',`footer.cols.${ci}.title`)}
      ${col.links.map((l,li)=>CARD('Link '+(li+1),li,`<button class="mini del" data-a="dellink" data-c="${ci}" data-i="${li}">Delete</button>`,F('Label',`footer.cols.${ci}.links.${li}.l`)+F('Goes to',`footer.cols.${ci}.links.${li}.h`))).join('')}
      <div class="arow"><button class="abtn" data-a="addlink" data-c="${ci}">+ Add link</button></div>`).join('')}`; },
  settings(){ return `
    <h4>Change password</h4>
    ${sb?'':'<label class="f">Current password<input type="password" id="pw0" autocomplete="off"></label>'}
    <label class="f">New password (min ${sb?8:6} characters)<input type="password" id="pw1" autocomplete="off"></label>
    <label class="f">Confirm new password<input type="password" id="pw2" autocomplete="off"></label>
    <div class="arow"><button class="abtn pri" data-a="chgpw">Update password</button></div><div id="pwmsg" class="pnote"></div>
    <h4>Save & share your website</h4>
    <p class="pnote">${sb?'Your edits are saved online automatically. Visitors see them right away — no need to upload anything.':'Your edits are saved automatically in this browser. To put the updated site online or open it on another device, download the site file and upload it in place of your current index.html.'}</p>
    <div class="arow"><button class="abtn pri" data-a="export-site">⬇ Download website file</button></div>
    <h4>Backup</h4>
    <div class="arow"><button class="abtn" data-a="export-json">Export backup</button><label class="abtn" style="text-align:center">Import backup<input type="file" accept=".json,application/json" data-import hidden></label></div>
    <h4>Session</h4>
    <div class="arow"><button class="abtn" data-a="logout">Log out</button>${sb?'':'<button class="abtn" data-a="reset" style="border-color:#8a2a22;color:#ff8d80">Reset all edits</button>'}</div>`; }
};
let orders=[], ordersMsg='', orderCh=null;
async function loadOrders(){
  if(!sb||!sbAuthed) return;
  const {data:rows,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  if(error) ordersMsg=error.message; else { orders=rows||[]; ordersMsg=''; }
  if(tab==='orders' && !$('#panel').classList.contains('closed')) renderPanel();
}
TABS.orders = () => `<h4>Orders (${orders.length})</h4>${ordersMsg?`<p class="pnote">${esc(ordersMsg)}</p>`:''}
  <div class="arow"><button class="abtn" data-a="refresh-orders">↻ Refresh</button></div>
  ${orders.map(o=>`<div class="card"><div class="ctop"><span>${esc(o.customer_name)} · ${money(o.total)}</span></div>
    <div class="pnote" style="color:#eee;margin-top:0">${(o.items||[]).map(i=>`${esc(i.qty)}× ${esc(i.name)}${i.size?' ('+esc(i.size)+')':''}`).join(', ')}<br>
    Phone: ${esc(o.phone)} · ${esc(o.delivery_method||'')}${o.address?' – '+esc(o.address):''}<br>
    M-Pesa code: <b>${esc(o.mpesa_code||'not paid yet')}</b>${o.note?'<br>Note: '+esc(o.note):''}<br>
    <small>${esc(new Date(o.created_at).toLocaleString('en-KE'))}</small></div>
    <label class="f">Status<select data-order="${esc(o.id)}">${['new','paid','delivered','cancelled'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('')}</select></label></div>`).join('') || '<p class="pnote">No orders yet.</p>'}`;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,12000); }
function startOrderWatch(){
  if(!sb||orderCh) return;
  loadOrders();
  orderCh = sb.channel('orders-watch').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>{
    const o=p.new; orders.unshift(o); toast(`🛒 New order from ${o.customer_name} — ${money(o.total)}`);
    if(tab==='orders' && !$('#panel').classList.contains('closed')) renderPanel();
  }).subscribe();
}
const TABNAMES = {site:'Site',about:'About',games:'Games',shop:'Shop',team:'Team',news:'News',gallery:'Gallery',footer:'Footer',settings:'Settings',orders:'Orders'};

function renderPanel(){
  $('#tabs').innerHTML = Object.keys(TABNAMES).filter(k=>k!=='orders'||sb).map(k=>`<button data-tab="${k}" class="${k===tab?'on':''}">${TABNAMES[k]}</button>`).join('');
  const b=$('#pbody'), y=b.scrollTop; b.innerHTML = TABS[tab](); b.scrollTop=y;
  $('#panel .p-head img').src = logoSrc();
}
async function checkConn(){
  const s=$('#pmode'); if(!s) return;
  if(!sb){ s.textContent='⚠ LOCAL ONLY — edits stay in this browser and other devices will NOT see them (Supabase is not connected in this file).'; s.className='bad'; return; }
  s.textContent='Checking online connection…'; s.className='';
  const {error}=await sb.from('site_content').select('id').limit(1);
  if(error){ s.textContent='⚠ Supabase problem: '+error.message; s.className='bad'; }
  else { s.textContent='✓ Online — edits are saved to Supabase and shown to every visitor.'; s.className='ok'; }
}
const openPanel = () => { if(!authed) return; renderPanel(); $('#panel').classList.remove('closed'); $('#fab').hidden=true; checkConn(); };
const closePanel = () => { $('#panel').classList.add('closed'); $('#fab').hidden=!authed; };

/* ---------- admin: login ---------- */
let clicks=[], fails=0, lockUntil=0;
document.addEventListener('click', e=>{
  if(!e.target.closest('#logoTrigger')) return;
  const n=Date.now(); clicks=clicks.filter(t=>n-t<800); clicks.push(n);
  if(clicks.length>=3){ e.preventDefault(); clicks=[]; authed ? openPanel() : openLogin(); }
});
function openLogin(){ $('#em').hidden=!sb; $('#loginOv').hidden=false; $('#loginErr').textContent=sb?'':'Not connected to Supabase: edits will stay in this browser only.'; const i=$('#pw'); i.value=''; setTimeout(()=>i.focus(),50); $('#loginLogo').src=logoSrc(); }
$('#loginCancel').onclick = () => $('#loginOv').hidden=true;
$('#loginForm').onsubmit = e => {
  e.preventDefault();
  if(sb){ sbLogin(); return; }
  if(Date.now()<lockUntil){ $('#loginErr').textContent='Too many attempts. Wait a moment.'; return; }
  if(hash($('#pw').value)===data.pass){ authed=true; sessionStorage.setItem('mh_admin','1'); fails=0; $('#loginOv').hidden=true; openPanel(); }
  else { fails++; $('#pw').value=''; $('#loginErr').textContent='Wrong password'; if(fails>=5){ lockUntil=Date.now()+30000; fails=0; $('#loginErr').textContent='Locked for 30 seconds'; } }
};
async function sbLogin(){
  const err=$('#loginErr'); err.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){ err.textContent='Wrong email or password'; $('#pw').value=''; return; }
  sbAuthed=true; authed=true; $('#loginOv').hidden=true; openPanel(); startOrderWatch();
}
$('#fab').onclick = openPanel;
$('#pclose').onclick = closePanel;

/* ---------- admin: events ---------- */
const NEW = {
  nav: () => ({label:'New link',href:'#'}),
  game: () => { const d=new Date(Date.now()+7*864e5); d.setHours(16,0,0,0); const p=n=>String(n).padStart(2,'0'); return {when:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T16:00`,opponent:'Opponent',venue:'Venue',logo:''}; },
  player: () => ({num:'00',name:'New Player',pos:'Guard',photo:''}),
  product: () => ({name:'New product',price:'1000',sizes:'',desc:'',inStock:true,img:''}),
  news: () => ({date:fmtDate(new Date()),title:'New article',text:'',link:'#',img:''})
};
const LIST = {nav:'nav',game:'schedule.games',player:'team.players',product:'shop.items',news:'news.items',gal:'gallery.images'};

$('#panel').addEventListener('input', e=>{
  const p=e.target.dataset.p; if(!p) return;
  set(p, e.target.type==='checkbox' ? e.target.checked : e.target.value); save(); later();
});
$('#panel').addEventListener('change', async e=>{
  const t=e.target;
  try{
    if(t.dataset.img){ const [m,png]=IMGCFG(t.dataset.img); if(!t.files[0]) return; set(t.dataset.img, await imgUpload(t.files[0],m,png)); save(); renderSite(); renderPanel(); }
    else if('gal' in t.dataset){ const fl=[...t.files]; let n=0; for(const f of fl){ status(`Uploading photo ${++n} of ${fl.length}…`); data.gallery.images.push({src:await imgUpload(f,900,false),cat:t.dataset.gal}); } t.value=''; save(); renderSite(); renderPanel(); }
    else if(t.dataset.bulk){
      const k=t.dataset.bulk, fl=[...t.files], [field,max]={player:['photo',700],news:['img',900],product:['img',900]}[k], arr=get(LIST[k]); let n=0;
      for(const f of fl){ status(`Uploading photo ${++n} of ${fl.length}…`); const item=NEW[k](); item[field]=await imgUpload(f,max,false);
        const nm=cleanName(f.name); if(nm){ if(k==='news') item.title=nm; else item.name=nm; } arr.push(item); }
      t.value=''; save(); renderSite(); renderPanel(); }
    else if(t.dataset.order){ const {error}=await sb.from('orders').update({status:t.value}).eq('id',t.dataset.order); if(error) throw error; const o=orders.find(x=>x.id===t.dataset.order); if(o) o.status=t.value; status('Order updated ✓'); }
    else if('import' in t.dataset && t.files[0]){ const o=JSON.parse(await t.files[0].text()); if(!o.club||!o.team) throw 0; data=o; save(); renderSite(); renderPanel(); status('Backup imported ✓'); }
  }catch(err){ status((err&&err.message)||'Could not use that file', true); }
});
$('#panel').addEventListener('click', e=>{
  const t=e.target.closest('[data-tab],[data-a]'); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; if(tab==='orders') loadOrders(); renderPanel(); $('#pbody').scrollTop=0; return; }
  const a=t.dataset.a, k=t.dataset.k, i=+t.dataset.i;
  const arr = k ? get(LIST[k]) : null;
  if(a==='add'){ arr.push(NEW[k]()); }
  else if(a==='dup'){ const c=clone(arr[i]); c.name=(c.name||'Item')+' (copy)'; arr.splice(i+1,0,c); }
  else if(a==='del'){ if(k!=='gal' && !confirm('Delete this item?')) return; arr.splice(i,1); }
  else if(a==='up'||a==='down'){ const j=a==='up'?i-1:i+1; [arr[i],arr[j]]=[arr[j],arr[i]]; }
  else if(a==='clrimg'){ set(t.dataset.p,''); }
  else if(a==='addlink'){ data.footer.cols[+t.dataset.c].links.push({l:'New link',h:'#'}); }
  else if(a==='dellink'){ data.footer.cols[+t.dataset.c].links.splice(i,1); }
  else if(a==='logout'){ authed=false; sessionStorage.removeItem('mh_admin'); if(sb){ sb.auth.signOut(); sb.removeAllChannels(); orderCh=null; sbAuthed=false; } closePanel(); return; }
  else if(a==='reset'){ if(!confirm('Erase ALL your edits and go back to the original content in this file?')) return; localStorage.removeItem(KEY); load(); renderSite(); renderPanel(); status('Reset done'); return; }
  else if(a==='refresh-orders'){ loadOrders(); return; }
  else if(a==='chgpw'){ if(sb){ sbChangePw(); return; } const m=$('#pwmsg'), o=$('#pw0').value, n=$('#pw1').value, c=$('#pw2').value;
    if(hash(o)!==data.pass) m.textContent='Current password is wrong.'; else if(n.length<6) m.textContent='New password must be at least 6 characters.'; else if(n!==c) m.textContent='New passwords do not match.';
    else { data.pass=hash(n); save(); m.textContent='Password updated ✓'; $('#pw0').value=$('#pw1').value=$('#pw2').value=''; } return; }
  else if(a==='export-json'){ download('maweni-hornets-backup.json', JSON.stringify(data), 'application/json'); return; }
  else if(a==='export-site'){ exportSite(); return; }
  save(); renderSite(); renderPanel();
});
async function sbChangePw(){
  const m=$('#pwmsg'), n=$('#pw1').value, c=$('#pw2').value;
  if(n.length<8){ m.textContent='New password must be at least 8 characters.'; return; }
  if(n!==c){ m.textContent='New passwords do not match.'; return; }
  const {error}=await sb.auth.updateUser({password:n});
  m.textContent = error ? error.message : 'Password updated ✓';
  if(!error) $('#pw1').value=$('#pw2').value='';
}
function download(name,text,type){ const u=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function exportSite(){
  data.v=Date.now(); save();
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#site').innerHTML='';
  c.querySelector('#tabs').innerHTML=''; c.querySelector('#pbody').innerHTML='';
  c.querySelector('#panel').className='closed';
  c.querySelector('#loginOv').setAttribute('hidden',''); c.querySelector('#fab').setAttribute('hidden','');
  c.querySelector('#pstatus').textContent='';
  c.querySelector('#cartBody').innerHTML=''; c.querySelector('#cart').className='closed';
  c.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
  c.style.cssText=''; 
  download('index.html','<!DOCTYPE html>\n'+c.outerHTML,'text/html');
  status('Website file downloaded ✓');
}

/* ---------- start ---------- */
load(); renderSite(); updateCount();
if(authed) $('#fab').hidden=false;
if(sb){
  sb.auth.getSession().then(({data:{session}})=>{ if(session){ sbAuthed=true; authed=true; $('#fab').hidden=false; startOrderWatch(); } });
}
pullRemote();
})();

</script>
</body>
